<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API Test Console</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', sans-serif; background: #1a1a2e; color: #eee; min-height: 100vh; padding: 20px; }
        .container { max-width: 900px; margin: 0 auto; }
        h1 { text-align: center; margin-bottom: 30px; color: #00d9ff; }
        .section { background: #16213e; border-radius: 10px; padding: 20px; margin-bottom: 20px; }
        .section h2 { color: #00d9ff; margin-bottom: 15px; font-size: 18px; border-bottom: 1px solid #333; padding-bottom: 10px; }
        .row { display: flex; gap: 10px; margin-bottom: 10px; flex-wrap: wrap; }
        input, select, textarea { background: #0f3460; border: 1px solid #333; color: #fff; padding: 10px; border-radius: 5px; font-size: 14px; }
        input:focus, select:focus, textarea:focus { outline: 2px solid #00d9ff; border-color: #00d9ff; }
        .url-input { flex: 1; min-width: 300px; }
        .method-select { width: 100px; background: #0f3460; }
        button { background: #00d9ff; color: #1a1a2e; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; font-weight: bold; transition: 0.2s; }
        button:hover { background: #00b8d4; }
        button:disabled { background: #555; cursor: not-allowed; }
        .btn-small { padding: 8px 15px; font-size: 13px; }
        .btn-chat { background: #4caf50; }
        .btn-chat:hover { background: #388e3c; }
        textarea { width: 100%; min-height: 80px; resize: vertical; font-family: monospace; }
        .response { background: #0d1b2a; border: 1px solid #333; border-radius: 5px; padding: 15px; margin-top: 15px; max-height: 300px; overflow-y: auto; }
        .response pre { white-space: pre-wrap; word-break: break-all; font-size: 13px; }
        .status { font-weight: bold; margin-bottom: 10px; }
        .status-2xx { color: #4caf50; }
        .status-4xx { color: #ff9800; }
        .status-5xx { color: #f44336; }
        .session-info { display: flex; gap: 10px; align-items: center; margin-bottom: 15px; flex-wrap: wrap; }
        .session-info span { background: #0f3460; padding: 8px 15px; border-radius: 5px; font-size: 13px; }
        .session-info strong { color: #00d9ff; }
        .chat-container { display: flex; flex-direction: column; gap: 15px; }
        .chat-message { padding: 15px; border-radius: 10px; max-width: 85%; }
        .chat-message.user { background: #0f3460; align-self: flex-end; border-bottom-right-radius: 2px; }
        .chat-message.agent { background: #1e5f74; align-self: flex-start; border-bottom-left-radius: 2px; }
        .chat-message .sender { font-size: 12px; color: #00d9ff; margin-bottom: 5px; }
        .chat-message .text { line-height: 1.5; }
        .chat-history { max-height: 400px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; padding: 10px; background: #0d1b2a; border-radius: 5px; }
        .intent { font-size: 11px; color: #aaa; margin-top: 5px; }
        label { display: block; margin-bottom: 5px; color: #aaa; font-size: 13px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>API Test Console</h1>

        <div class="section">
            <h2>Session Management</h2>
            <div class="session-info">
                <span>Session ID: <strong id="currentSessionId">None</strong></span>
                <span>Persona: <strong id="currentPersona">None</strong></span>
            </div>
            <div class="row">
                <select id="personaSelect" class="method-select">
                    <option value="medical">medical</option>
                    <option value="commercial" selected>commercial</option>
                </select>
                <input type="text" id="customSessionId" placeholder="Custom Session ID (optional)" style="flex: 1;">
                <button onclick="startSession()">Start Session</button>
                <button onclick="listSessions()" class="btn-small">List Sessions</button>
                <button onclick="deleteSession()" class="btn-small" style="background: #f44336;">Delete</button>
                <button onclick="resetSession()" class="btn-small">Reset</button>
            </div>
        </div>

        <div class="section">
            <h2>Chat</h2>
            <div class="chat-history" id="chatHistory">
                <div id="typingIndicator" style="display: none; padding: 15px; color: #888; font-style: italic;">
                    <span id="typingText">L'agent réfléchit...</span>
                    <span id="typingDots">...</span>
                </div>
            </div>
            <div class="chat-container" style="margin-top: 15px;">
                <textarea id="chatMessage" placeholder="Type your message in French..."></textarea>
                <button onclick="sendChat()" class="btn-chat" id="sendBtn">Send Message</button>
            </div>
        </div>

        <div class="section">
            <h2>Raw Request</h2>
            <div class="row">
                <select id="method" class="method-select">
                    <option>GET</option>
                    <option>POST</option>
                    <option>DELETE</option>
                </select>
                <input type="text" id="url" class="url-input" value="http://localhost:8000/health">
                <button onclick="sendRequest()">Send</button>
            </div>
            <label>Body (JSON)</label>
            <textarea id="body" placeholder='{"key": "value"}'></textarea>
        </div>

        <div class="section">
            <h2>Response</h2>
            <div class="response">
                <div id="status" class="status">No request yet</div>
                <pre id="response"></pre>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = 'http://localhost:8000';
        let currentSessionId = null;
        let currentPersona = null;

        function updateSessionDisplay(sessionId, persona) {
            currentSessionId = sessionId;
            currentPersona = persona;
            document.getElementById('currentSessionId').textContent = sessionId || 'None';
            document.getElementById('currentPersona').textContent = persona || 'None';
        }

        async function startSession() {
            const persona = document.getElementById('personaSelect').value;
            const customId = document.getElementById('customSessionId').value;
            
            const body = { persona };
            if (customId) body.session_id = customId;

            const response = await fetch(`${API_BASE}/session/start`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(body)
            });

            const data = await response.json();
            showResponse(response.status, data);
            
            if (response.ok) {
                updateSessionDisplay(data.session_id, data.persona);
                document.getElementById('customSessionId').value = data.session_id;
            }
        }

        let typingInterval;
        function showTyping(show) {
            const indicator = document.getElementById('typingIndicator');
            const dots = document.getElementById('typingDots');
            const sendBtn = document.getElementById('sendBtn');
            
            if (show) {
                indicator.style.display = 'block';
                sendBtn.disabled = true;
                sendBtn.textContent = 'En cours...';
                
                let dotCount = 0;
                typingInterval = setInterval(() => {
                    dotCount = (dotCount + 1) % 4;
                    dots.textContent = '.'.repeat(dotCount);
                }, 500);
            } else {
                indicator.style.display = 'none';
                sendBtn.disabled = false;
                sendBtn.textContent = 'Send Message';
                if (typingInterval) {
                    clearInterval(typingInterval);
                    typingInterval = null;
                }
            }
        }

        async function sendChat() {
            if (!currentSessionId) {
                alert('No active session! Start a session first.');
                return;
            }

            const message = document.getElementById('chatMessage').value;
            if (!message.trim()) return;

            addChatMessage('user', message);
            showTyping(true);

            try {
                const response = await fetch(`${API_BASE}/chat`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ session_id: currentSessionId, message })
                });

                const data = await response.json();
                showTyping(false);
                showResponse(response.status, data);

                if (response.ok) {
                    addChatMessage('agent', data.agent_response, data.intent);
                } else {
                    addChatMessage('agent', `Erreur: ${data.detail || 'Une erreur est survenue'}`, 'ERROR');
                }
            } catch (error) {
                showTyping(false);
                addChatMessage('agent', 'Erreur de connexion au serveur.', 'ERROR');
            }

            document.getElementById('chatMessage').value = '';
        }

        function addChatMessage(type, text, intent = null) {
            const history = document.getElementById('chatHistory');
            const div = document.createElement('div');
            div.className = `chat-message ${type}`;
            div.innerHTML = `
                <div class="sender">${type === 'user' ? 'You' : 'Agent (' + (currentPersona || '') + ')'}</div>
                <div class="text">${text}</div>
                ${intent ? `<div class="intent">Intent: ${intent}</div>` : ''}
            `;
            history.appendChild(div);
            history.scrollTop = history.scrollHeight;
        }

        async function listSessions() {
            const response = await fetch(`${API_BASE}/sessions`);
            const data = await response.json();
            showResponse(response.status, data);
        }

        async function deleteSession() {
            if (!currentSessionId) {
                alert('No active session to delete.');
                return;
            }

            const response = await fetch(`${API_BASE}/session/${currentSessionId}`, {
                method: 'DELETE'
            });

            const data = await response.json();
            showResponse(response.status, data);

            if (response.ok) {
                updateSessionDisplay(null, null);
                document.getElementById('customSessionId').value = '';
                document.getElementById('chatHistory').innerHTML = '';
            }
        }

        async function resetSession() {
            if (!currentSessionId) {
                alert('No active session to reset.');
                return;
            }

            const response = await fetch(`${API_BASE}/session/${currentSessionId}/reset`, {
                method: 'POST'
            });

            const data = await response.json();
            showResponse(response.status, data);

            if (response.ok) {
                document.getElementById('chatHistory').innerHTML = '';
            }
        }

        async function sendRequest() {
            const method = document.getElementById('method').value;
            const url = document.getElementById('url').value;
            const body = document.getElementById('body').value;

            const options = {
                method,
                headers: { 'Content-Type': 'application/json' }
            };

            if (body && method !== 'GET') {
                options.body = body;
            }

            const response = await fetch(url, options);
            let data;
            try {
                data = await response.json();
            } catch {
                data = await response.text();
            }

            showResponse(response.status, data);
        }

        function showResponse(status, data) {
            const statusEl = document.getElementById('status');
            const responseEl = document.getElementById('response');

            statusEl.textContent = `Status: ${status}`;
            statusEl.className = 'status';
            
            if (status >= 200 && status < 300) statusEl.classList.add('status-2xx');
            else if (status >= 400 && status < 500) statusEl.classList.add('status-4xx');
            else if (status >= 500) statusEl.classList.add('status-5xx');

            responseEl.textContent = JSON.stringify(data, null, 2);
        }

        document.getElementById('chatMessage').addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendChat();
            }
        });
    </script>
</body>
</html>
