# SRS configuration for Co_Win Platform
listen              1935;
max_connections     1000;
daemon              off;
srs_log_tank        console;

http_api {
    enabled         on;
    listen          1985;
    crossdomain     on;
}

http_server {
    enabled         on;
    listen          8080;
    dir             ./objs/nginx/html;
}

rtc_server {
    enabled         on;
    listen          8000; # UDP port
    # Switching to 127.0.0.1 for local Docker-Host communication
    candidate       127.0.0.1;
}

vhost __defaultVhost__ {
    rtc {
        enabled     on;
        # Enable bridges for better session handling compatibility
        rtmp_to_rtc on;
        rtc_to_rtmp on;
        nack        on;
        twcc        on;
    }
    
    http_remux {
        enabled     on;
        mount       [vhost]/[app]/[stream].flv;
    }
}
