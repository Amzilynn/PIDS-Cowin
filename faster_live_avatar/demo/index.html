<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sarah Khalil - LivePortrait GPU Dashboard</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.2/socket.io.min.js"></script>
    <script>
        if (typeof io === 'undefined') {
            console.warn("CDN failed, trying local fallback...");
            document.write('<script src="/socket.io/socket.io.js"><\/script>');
        }
    </script>
    <style>
        :root {
            --bg: #0a0a0c;
            --panel: #16161a;
            --accent: #00d9ff;
            --text: #ffffff;
            --glass: rgba(255, 255, 255, 0.03);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            background: var(--bg); 
            color: var(--text); 
            font-family: 'Inter', -apple-system, sans-serif;
            overflow: hidden;
            display: flex;
            height: 100vh;
        }

        /* Sidebar Controls */
        .sidebar {
            width: 380px;
            background: var(--panel);
            border-right: 1px solid rgba(255,255,255,0.1);
            display: flex;
            flex-direction: column;
            padding: 30px;
            z-index: 10;
        }

        h1 { font-size: 24px; font-weight: 800; margin-bottom: 5px; color: var(--accent); }
        .subtitle { font-size: 12px; opacity: 0.5; margin-bottom: 40px; text-transform: uppercase; letter-spacing: 2px; }

        .input-group { margin-bottom: 25px; }
        label { display: block; font-size: 11px; text-transform: uppercase; opacity: 0.6; margin-bottom: 8px; letter-spacing: 1px; }
        
        textarea {
            width: 100%;
            height: 120px;
            background: rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            color: white;
            padding: 15px;
            font-family: inherit;
            font-size: 14px;
            resize: none;
            transition: 0.3s;
        }
        textarea:focus { outline: none; border-color: var(--accent); background: rgba(0,0,0,0.5); }

        button {
            width: 100%;
            padding: 15px;
            background: var(--accent);
            color: #000;
            border: none;
            border-radius: 12px;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 10px;
        }
        button:hover { transform: translateY(-2px); box-shadow: 0 10px 20px rgba(0, 217, 255, 0.2); }
        button:active { transform: translateY(0); }
        button:disabled { opacity: 0.3; cursor: not-allowed; transform: none; }

        /* Main Viewport */
        .viewport {
            flex: 1;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle at center, #1a1a2e 0%, #0a0a0c 100%);
        }

        .avatar-container {
            width: 512px;
            height: 512px;
            border-radius: 24px;
            overflow: hidden;
            box-shadow: 0 50px 100px rgba(0,0,0,0.8);
            border: 1px solid rgba(255,255,255,0.1);
            background: #000;
            position: relative;
        }

        canvas {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .status-overlay {
            position: absolute;
            bottom: 20px;
            left: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(10px);
            padding: 8px 16px;
            border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.1);
            font-size: 12px;
        }

        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #555;
        }
        .dot.active { background: #4caf50; box-shadow: 0 0 10px #4caf50; animation: pulse 1.5s infinite; }
        .dot.speaking { background: var(--accent); box-shadow: 0 0 10px var(--accent); }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.4; }
            100% { opacity: 1; }
        }

        .loading-screen {
            position: absolute;
            inset: 0;
            background: var(--bg);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
            transition: 0.5s;
        }
        .loader {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(255,255,255,0.1);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        #debug-info {
            position: absolute;
            top: 20px;
            right: 20px;
            font-family: monospace;
            font-size: 10px;
            color: rgba(255,255,255,0.3);
            text-align: right;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div id="loading" class="loading-screen">
        <div class="loader"></div>
        <p>Connecting to GPU Engine...</p>
    </div>

    <div class="sidebar">
        <h1>SARAH KHALIL</h1>
        <p class="subtitle">LivePortrait v1.0</p>

        <div class="input-group">
            <label>Chat Interface</label>
            <textarea id="textInput" placeholder="Enter text for Sarah to say..."></textarea>
            <button id="sendBtn">EXECUTE SPEECH</button>
        </div>

        <div class="input-group">
            <label>Voice Selection</label>
            <select id="voiceSelect" style="width: 100%; background: #000; color: white; border: 1px solid #333; padding: 10px; border-radius: 8px;">
                <option value="en-US-AriaNeural">Aria (Standard)</option>
                <option value="en-US-EmmaNeural">Emma (Soft)</option>
                <option value="en-GB-SoniaNeural">Sonia (British)</option>
                <option value="fr-FR-DeniseNeural">Denise (French)</option>
            </select>
        </div>

        <div style="margin-top: auto; padding-top: 20px; border-top: 1px solid rgba(255,255,255,0.05);">
            <div style="display: flex; justify-content: space-between; font-size: 11px; opacity: 0.5;">
                <span>LATENCY</span>
                <span id="latencyVal">0ms</span>
            </div>
            <div style="display: flex; justify-content: space-between; font-size: 11px; opacity: 0.5; margin-top: 5px;">
                <span>FPS</span>
                <span id="fpsVal">0</span>
            </div>
        </div>
    </div>

    <div class="viewport">
        <div id="debug-info">
            ENGINE: PYTORCH CUDA 12.1<br>
            BUFFER: 0 FRAMES<br>
            STATUS: READY
        </div>

        <div class="avatar-container">
            <canvas id="avatarCanvas" width="512" height="512"></canvas>
            
            <div class="status-overlay">
                <div id="statusDot" class="dot"></div>
                <span id="statusText">CONNECTING</span>
            </div>

            <audio id="avatarAudio" crossorigin="anonymous"></audio>
            
            <button id="unlockBtn" style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); padding: 15px 30px; background: var(--accent); color: #000; border: none; border-radius: 30px; font-weight: bold; cursor: pointer; z-index: 10; box-shadow: 0 0 20px var(--accent);">WAKE UP SARAH</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('avatarCanvas');
        const ctx = canvas.getContext('2d');
        const socket = io('http://localhost:8027', {
            transports: ['websocket', 'polling'], // Allow fallback
            reconnectionAttempts: 10
        });
        
        let frameCount = 0;
        let lastTime = Date.now();
        let isSpeaking = false;

        // Socket Events
        socket.on('connect', () => {
            document.getElementById('loading').style.opacity = '0';
            setTimeout(() => document.getElementById('loading').style.display = 'none', 500);
            document.getElementById('statusDot').className = 'dot active';
            document.getElementById('statusText').innerText = 'GPU ONLINE';
        });

        socket.on('avatar_frame', (data) => {
            const img = new Image();
            img.onload = () => {
                ctx.drawImage(img, 0, 0, 512, 512);
            };
            img.src = 'data:image/jpeg;base64,' + data.frame;
            
            // FPS Counter
            frameCount++;
            if (Date.now() - lastTime > 1000) {
                document.getElementById('fpsVal').innerText = frameCount;
                frameCount = 0;
                lastTime = Date.now();
            }

            if (data.is_speaking) {
                document.getElementById('statusDot').className = 'dot active speaking';
                document.getElementById('statusText').innerText = 'SPEAKING';
            } else {
                document.getElementById('statusDot').className = 'dot active';
                document.getElementById('statusText').innerText = 'IDLE';
            }
        });

        // Audio Context for Lip Sync
        let audioCtx = null;
        let analyzer = null;
        let audioSource = null;
        let smoothedLip = 0; // Low-pass filter

        document.getElementById('unlockBtn').onclick = function() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            audioCtx.resume();
            this.style.display = 'none';
            console.log("Audio unlocked");
        };

        function initAudioAnalyzer(audioElement) {
            if (analyzer) return;
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            
            analyzer = audioCtx.createAnalyser();
            analyzer.fftSize = 128; // Smaller for faster response
            audioSource = audioCtx.createMediaElementSource(audioElement);
            audioSource.connect(analyzer);
            analyzer.connect(audioCtx.destination);
            
            requestAnimationFrame(updateLipSync);
        }

        let lastEmitTime = 0;
        function updateLipSync() {
            if (!analyzer) return;
            let now = Date.now();
            
            let dataArray = new Uint8Array(analyzer.frequencyBinCount);
            analyzer.getByteFrequencyData(dataArray);
            
            let sum = 0;
            for(let i=1; i<dataArray.length/2; i++) sum += dataArray[i];
            let average = sum / (dataArray.length/2);
            
            /* Server-side sync is now active. Browser-side analysis is disabled for performance. */
            // let targetLip = Math.min(1.0, average / 5.0); 
            // smoothedLip = smoothedLip * 0.4 + targetLip * 0.6; 
            
            // if (now - lastEmitTime > 33 && socket.connected) {
            //     socket.emit("lip_sync_data", { lip: smoothedLip });
            //     lastEmitTime = now;
            // }
            
            requestAnimationFrame(updateLipSync);
        }


        socket.on('avatar_audio', (data) => {
            console.log("Audio received");
            const audio = document.getElementById('avatarAudio');
            
            // Set source
            audio.src = `data:audio/mp3;base64,${data.audio}`;
            
            // Resume AudioContext
            if (audioCtx && audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            
            initAudioAnalyzer(audio);
            
            // Fire 'audio_started' to server the EXACT moment browser starts playing.
            // This is the ground-truth T=0 that the server uses for lip-sync timing.
            audio.onplaying = () => {
                socket.emit('audio_started', {});
                console.log('[SYNC] audio_started emitted to server');
            };

            audio.play().catch(e => console.warn("Autoplay blocked:", e));
        });

        // Controls
        document.getElementById('sendBtn').onclick = () => {
            const text = document.getElementById('textInput').value;
            const voice = document.getElementById('voiceSelect').value;
            if (!text) return;

            fetch('http://localhost:8027/chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ text, voice })
            });

            document.getElementById('textInput').value = '';
        };

        // Enter to send
        document.getElementById('textInput').onkeydown = (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                document.getElementById('sendBtn').click();
            }
        };
    </script>
</body>
</html>
